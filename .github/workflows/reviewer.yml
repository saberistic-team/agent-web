name: Agent — Reviewer

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:reviewer'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: read
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint Reviewer App token
        id: reviewer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Run reviewer agent
        env:
          GITHUB_TOKEN: ${{ steps.reviewer.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          MODELS_TOKEN: ${{ github.token }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          SCREENSHOTS_REQUIRED: ${{ vars.SCREENSHOTS_REQUIRED }}
        run: |
          python scripts/run_agent.py \
            --role reviewer \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/reviewer.md

      - name: Resolve decision from PR review API
        id: decision
        env:
          GITHUB_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          set -euo pipefail
          DECISION="$(python scripts/review_decision.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}")"
          echo "value=${DECISION}" >> "$GITHUB_OUTPUT"

      - name: Advance status
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          DECISION: ${{ steps.decision.outputs.value }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          for label in review:needs-review review:approved review:changes-requested; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done

          case "${DECISION}" in
            approved)
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:approved" \
                --remove-label "agent:reviewer"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`approved\` (from GitHub PR review API + Models AI)
          EOF
          )"
              ;;
            blocked)
              for label in status:new status:queued status:in-progress status:needs-review status:done status:failed agent:builder agent:reviewer; do
                gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
              done
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:changes-requested" \
                --add-label "status:blocked" \
                --remove-label "agent:reviewer"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`blocked\` (terminal review hard-fail)
          - next: \`@human-review\` (not requeuing builder)
          EOF
          )"
              ;;
            changes-requested)
              for label in status:new status:in-progress status:blocked status:needs-review status:done status:failed; do
                gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
              done
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:changes-requested" \
                --add-label "status:queued" \
                --add-label "agent:builder" \
                --remove-label "agent:reviewer"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`changes-requested\` (from GitHub PR review API + Models AI)
          - next: \`agent:builder\`
          EOF
          )"
              ;;
            *)
              echo "Unknown reviewer decision: ${DECISION}"
              exit 1
              ;;
          esac

      - name: Write trace
        if: always()
        run: |
          set -euo pipefail
          OUTCOME="ok"
          if [[ "${{ job.status }}" != "success" ]]; then OUTCOME="fail"; fi
          DECISION="${{ steps.decision.outputs.value }}"
          ACTION="review"
          if [[ -n "${DECISION}" ]]; then ACTION="review:${DECISION}"; fi
          python scripts/write_trace.py \
            --role reviewer \
            --issue "${{ github.event.issue.number }}" \
            --action "${ACTION}" \
            --outcome "${OUTCOME}" \
            --cost-usd 0

      - name: Upload screenshots + trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reviewer-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            trace/agent-trace.jsonl
            trace/screenshots/
          if-no-files-found: ignore
