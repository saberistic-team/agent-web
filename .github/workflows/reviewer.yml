name: Agent — Reviewer

on:
  issues:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:reviewer'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: read
      models: read
    steps:
      - name: Checkout main (agent scripts + Cursor review stack)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mint Reviewer App token
        id: reviewer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-agents.txt
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Checkout linked PR head into pr-head/
        id: prhead
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          PR="$(gh pr list --repo "${{ github.repository }}" --state open --json number,title,body,headRefName,headRefOid \
            --jq "[.[] | select((.title|contains(\"#${ISSUE}\")) or (.body|contains(\"#${ISSUE}\")) or (.body|test(\"Closes #${ISSUE}\";\"i\")))] | .[0]")"
          if [[ -z "${PR}" || "${PR}" == "null" ]]; then
            echo "No open PR linked to #${ISSUE}."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="$(echo "${PR}" | jq -r .headRefName)"
          SHA="$(echo "${PR}" | jq -r .headRefOid)"
          echo "Fetching PR head ${REF} @ ${SHA} into pr-head/"
          rm -rf pr-head
          git fetch origin "${REF}"
          git worktree add --detach pr-head "${SHA}"
          if [[ -f pr-head/requirements.txt ]]; then
            echo "Installing PR requirements for coverage"
            pip install -r pr-head/requirements.txt
          fi
          echo "has_pr=true" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Run reviewer agent
        env:
          GITHUB_TOKEN: ${{ steps.reviewer.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          SCREENSHOTS_REQUIRED: ${{ vars.SCREENSHOTS_REQUIRED }}
          COVERAGE_UNIT_MIN: ${{ vars.COVERAGE_UNIT_MIN }}
          COVERAGE_INTEGRATION_MIN: ${{ vars.COVERAGE_INTEGRATION_MIN }}
          # Coverage measures the PR tree; prefer PR-head screenshot_deploy when
          # present (run_agent.load_screenshot_deploy). Other agent scripts stay on main.
          COVERAGE_ROOT: ${{ github.workspace }}/pr-head
        run: |
          python scripts/run_agent.py \
            --role reviewer \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/reviewer.md

      - name: Resolve decision from PR review API
        id: decision
        env:
          GITHUB_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          set -euo pipefail
          DECISION="$(python scripts/review_decision.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}")"
          echo "value=${DECISION}" >> "$GITHUB_OUTPUT"

      - name: Advance status
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          DECISION: ${{ steps.decision.outputs.value }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          for label in review:needs-review review:approved review:changes-requested; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done

          case "${DECISION}" in
            approved)
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:approved" \
                --remove-label "agent:reviewer"
              GITHUB_TOKEN="${GH_TOKEN}" python scripts/pr_labels.py \
                --repo "${{ github.repository }}" \
                --issue "${ISSUE}" \
                --review review:approved || true
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`approved\` (from GitHub PR review API + Cursor/OpenAI/Models)
          - pr_labels: mirrored \`review:approved\`
          EOF
          )"
              ;;
            blocked)
              for label in status:new status:queued status:in-progress status:needs-review status:done status:failed agent:builder agent:reviewer; do
                gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
              done
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:changes-requested" \
                --add-label "status:blocked" \
                --remove-label "agent:reviewer"
              GITHUB_TOKEN="${GH_TOKEN}" python scripts/pr_labels.py \
                --repo "${{ github.repository }}" \
                --issue "${ISSUE}" \
                --review review:changes-requested || true
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`blocked\` (terminal review hard-fail)
          - next: \`@human-review\` (not requeuing builder)
          - pr_labels: mirrored \`review:changes-requested\`
          EOF
          )"
              ;;
            changes-requested)
              for label in status:new status:in-progress status:blocked status:needs-review status:done status:failed agent:builder agent:docs agent:reviewer agent:planner; do
                gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
              done
              # Re-enter priority queue; dispatcher applies agent:builder or
              # agent:docs from type:* when free.
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "review:changes-requested" \
                --add-label "status:queued" \
                --remove-label "agent:reviewer"
              GITHUB_TOKEN="${GH_TOKEN}" python scripts/pr_labels.py \
                --repo "${{ github.repository }}" \
                --issue "${ISSUE}" \
                --review review:changes-requested || true
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### reviewer_labels
          - decision: \`changes-requested\` (from GitHub PR review API + Cursor/OpenAI/Models)
          - next: \`status:queued\` (dispatcher will apply \`agent:builder\` or \`agent:docs\` from \`type:*\` by priority)
          - pr_labels: mirrored \`review:changes-requested\`
          EOF
          )"
              ;;
            *)
              echo "Unknown reviewer decision: ${DECISION}"
              exit 1
              ;;
          esac

      - name: Write trace
        if: always()
        run: |
          set -euo pipefail
          OUTCOME="ok"
          if [[ "${{ job.status }}" != "success" ]]; then OUTCOME="fail"; fi
          DECISION="${{ steps.decision.outputs.value }}"
          ACTION="review"
          if [[ -n "${DECISION}" ]]; then ACTION="review:${DECISION}"; fi
          python scripts/write_trace.py \
            --role reviewer \
            --issue "${{ github.event.issue.number }}" \
            --action "${ACTION}" \
            --outcome "${OUTCOME}" \
            --cost-usd 0

      - name: Upload screenshots + trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reviewer-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            trace/agent-trace.jsonl
            trace/screenshots/
          if-no-files-found: ignore
