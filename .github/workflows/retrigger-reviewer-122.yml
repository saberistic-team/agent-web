# One-shot: apply Reviewer handoff labels for issue #122 / PR #417 using the
# Builder GitHub App token so the labeled event can trigger Agent — Reviewer
# (GITHUB_TOKEN label mutations do not start new workflow runs).
name: Retrigger Reviewer (#122)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  handoff:
    if: github.event.pull_request.number == 417
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Apply reviewer handoff labels on issue #122
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
          ISSUE: "122"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Toggle agent:reviewer off then on so a fresh labeled event fires even
          # if the label is already present from a prior attempt.
          for label in \
            status:new status:queued status:in-progress status:blocked \
            status:done status:failed status:needs-review \
            review:needs-review review:approved review:changes-requested \
            agent:reviewer agent:builder agent:docs agent:planner
          do
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label "${label}" 2>/dev/null || true
          done
          sleep 2
          gh issue edit "${ISSUE}" --repo "${REPO}" \
            --add-label "status:needs-review" \
            --add-label "review:needs-review" \
            --add-label "agent:reviewer"
          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$(cat <<'EOM'
          ### builder_handoff
          - status: `status:needs-review`
          - next: `agent:reviewer`
          - note: App-token handoff so Reviewer workflow receives the labeled event (PR #417)
          EOM
          )"
          echo "Labels after handoff:"
          gh issue view "${ISSUE}" --repo "${REPO}" --json labels --jq '[.labels[].name]'
