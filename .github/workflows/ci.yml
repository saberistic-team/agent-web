name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Meta commits from screenshot/health recorders must not re-enter CI.
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'review: record') &&
        !startsWith(github.event.head_commit.message, 'deploy: record') &&
        !startsWith(github.event.head_commit.message, 'deploy: freeze')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agent_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agent_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/agent_web_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate workflow-governance ownership
        run: python scripts/validate_workflow_governance.py
      - name: Run tests
        # The live-PostgreSQL contract suite (marker: contract) runs in its own
        # path-scoped workflow (.github/workflows/pg-contract.yml) to keep this
        # job fast; exclude it here to avoid running it twice.
        run: pytest -q -m "not contract"
      - name: Service coverage
        run: python scripts/check_coverage.py

  deploy:
    name: Deploy to Render
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trigger Render deploy and wait until live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::Missing repo secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::Missing repo secret RENDER_API_KEY (needed to wait for deploy completion)"
            exit 1
          fi
          # Waits until Render marks the deploy live. Migrations run in app
          # startup — if they fail, Render status is update_failed and this
          # step exits non-zero. Also requires /health.schema_version to match.
          python scripts/render_deploy.py --ref "${{ github.sha }}"

  freeze-migrations:
    name: Freeze shipped migrations
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mint Builder token for freeze commit
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
      - name: Freeze digests after live deploy
        # Commits onto a deploy/freeze-* branch and opens a PR with
        # auto-merge enabled instead of pushing straight to main — a direct
        # push is rejected by the workflow-governance ruleset's independent-
        # review requirement (zero bypass actors, issue #359/#362).
        env:
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          # Deploy job already waited for live + schema; --wait-healthy is a
          # cheap confirm before writing freeze commits.
          python scripts/freeze_shipped_migrations.py \
            --commit \
            --wait-healthy \
            --repo "${{ github.repository }}" \
            --branch main

  post-deploy-visual:
    name: Post-deploy screenshots
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + agent deps
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          pip install -r requirements-agents.txt
      - name: Mint Builder token for uploads/comments
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
      - name: Capture post-deploy screenshots + record health
        env:
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          # Bounded post-deploy log inspection (#280). Owner id is optional —
          # crm_deploy_health resolves it from the service when unset.
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          # Passed via env, not interpolated straight into the run: string —
          # a commit message containing a `"` (e.g. quoting a 422 error
          # message) previously closed the --commit-message string early and
          # spilled the rest of the message into unrecognized argv, failing
          # this job before it ever captured a screenshot.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Deploy job already waited for Render to go live; short pause then
          # re-check health before screenshots.
          sleep 5
          python scripts/post_deploy_visual.py \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --commit-message "$HEAD_COMMIT_MESSAGE"
      - name: Upload deploy health JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-health-${{ github.sha }}
          path: trace/deploy-health.json
          if-no-files-found: ignore
