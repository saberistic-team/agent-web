name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Meta commits from screenshot/health recorders must not re-enter CI.
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'review: record') &&
        !startsWith(github.event.head_commit.message, 'deploy: record') &&
        !startsWith(github.event.head_commit.message, 'deploy: freeze')
      )
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agent_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agent_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/agent_web_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Service coverage
        run: python scripts/check_coverage.py

  deploy:
    name: Deploy to Render
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::Missing repo secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo
          echo "Triggered Render deploy for https://saberistic.com"

  freeze-migrations:
    name: Freeze shipped migrations
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mint Builder token for freeze commit
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
      - name: Wait for healthy deploy and freeze digests
        env:
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          # Allow Render a moment after the deploy hook before health polling.
          sleep 20
          python scripts/freeze_shipped_migrations.py \
            --commit \
            --wait-healthy \
            --repo "${{ github.repository }}" \
            --branch main

  post-deploy-visual:
    name: Post-deploy screenshots
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'review: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: record') &&
      !startsWith(github.event.head_commit.message, 'deploy: freeze')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + agent deps
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          pip install -r requirements-agents.txt
      - name: Mint Builder token for uploads/comments
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
      - name: Capture post screenshots + visual check
        env:
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          VISUAL_PROVIDER: ${{ vars.VISUAL_PROVIDER }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          # Allow Render a moment after hook before health polling starts.
          sleep 20
          python scripts/post_deploy_visual.py \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}"
      - name: Upload deploy health JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-health-${{ github.sha }}
          path: trace/deploy-health.json
          if-no-files-found: ignore
