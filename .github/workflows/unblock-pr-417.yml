# One-shot: CODEOWNER request + auto-merge + Reviewer retrigger for PR #417.
# Uses Builder App token (cloud agent GITHUB_TOKEN cannot mutate labels/reviewers).
name: "Unblock PR 417 (#122)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  unblock:
    if: github.event.pull_request.number == 417
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Request CODEOWNER, enable auto-merge, retrigger Reviewer
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
          REPO: ${{ github.repository }}
          PR: "417"
          ISSUE: "122"
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f reviewers[]=saberistic || true
          gh pr merge "${PR}" --repo "${REPO}" --squash --auto || true

          for label in \
            status:new status:queued status:in-progress status:blocked \
            status:done status:failed status:needs-review \
            review:needs-review review:approved review:changes-requested \
            agent:reviewer agent:builder agent:docs agent:planner
          do
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label "${label}" 2>/dev/null || true
          done
          sleep 2
          gh issue edit "${ISSUE}" --repo "${REPO}" \
            --add-label "status:needs-review" \
            --add-label "review:needs-review" \
            --add-label "agent:reviewer"

          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$(cat <<'EOM'
          ### builder_unblock
          - pr: #417
          - requested: `@saberistic` (CODEOWNER)
          - auto_merge: squash
          - next: `agent:reviewer`
          EOM
          )"
          gh pr view "${PR}" --repo "${REPO}" --json reviewRequests,autoMergeRequest,mergeStateStatus,reviewDecision
          gh issue view "${ISSUE}" --repo "${REPO}" --json labels --jq '[.labels[].name]'
