name: Gate

on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue_number:
        description: Issue to authorize
        required: true
        type: number
      intent:
        description: Gate intent (release-plan | review-approved)
        required: true
        type: string

jobs:
  check:
    # Reusable calls keep the *caller's* event_name (often `issues`), so detect
    # workflow_call via inputs.intent instead of github.event_name.
    if: >-
      inputs.intent == 'release-plan' ||
      inputs.intent == 'review-approved' ||
      github.event.label.name == 'review:approved'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve issue and intent
        id: meta
        run: |
          set -euo pipefail
          # inputs.* are set for reusable workflow_call even when the caller's
          # event_name is still `issues`.
          INTENT_INPUT="${{ inputs.intent }}"
          ISSUE_INPUT="${{ inputs.issue_number }}"
          if [[ -n "${INTENT_INPUT}" ]]; then
            echo "issue=${ISSUE_INPUT}" >> "$GITHUB_OUTPUT"
            echo "intent=${INTENT_INPUT}" >> "$GITHUB_OUTPUT"
            if [[ "${INTENT_INPUT}" == "release-plan" ]]; then
              echo "app=planner" >> "$GITHUB_OUTPUT"
            else
              echo "app=reviewer" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "intent=review-approved" >> "$GITHUB_OUTPUT"
            echo "app=reviewer" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint Planner App token
        if: steps.meta.outputs.app == 'planner'
        id: planner
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_PRIVATE_KEY }}

      - name: Mint Reviewer App token
        if: steps.meta.outputs.app == 'reviewer'
        id: reviewer
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check permission (planner identity for comment)
        if: steps.meta.outputs.app == 'planner'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_TOKEN: ${{ steps.planner.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/check_permission.py \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}" \
            --issue "${{ steps.meta.outputs.issue }}" \
            --min-level write

      - name: Check permission (reviewer identity for comment)
        if: steps.meta.outputs.app == 'reviewer'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_TOKEN: ${{ steps.reviewer.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/check_permission.py \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}" \
            --issue "${{ steps.meta.outputs.issue }}" \
            --min-level write

      - name: Proceed release-plan
        if: success() && steps.meta.outputs.intent == 'release-plan'
        env:
          GH_TOKEN: ${{ steps.planner.outputs.token }}
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### gate_release_plan
          - result: \`pass\`
          - actor: \`${{ github.actor }}\`
          - next: caller may queue
          EOF
          )"

      - name: Proceed review-approved (squash merge)
        if: success() && steps.meta.outputs.intent == 'review-approved'
        env:
          GH_TOKEN: ${{ steps.reviewer.outputs.token }}
          GITHUB_TOKEN: ${{ steps.reviewer.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          set -euo pipefail
          # Fail closed unless Reviewer posted a complete acceptance checklist
          # and issue dependencies are met (scripts/issue_deps.py / #204).
          python scripts/acceptance.py \
            --repo "${{ github.repository }}" \
            --issue "${ISSUE}" \
            --mode require

          if ! RESOLUTION="$(python scripts/resolve_issue_pr.py --repo "${{ github.repository }}" --issue "${ISSUE}")"; then
            gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### gate_merge
          - result: \`fail\`
          - detail: no unique open PR linked to #${ISSUE}; resolver: ${RESOLUTION}
          EOF
          )"
            exit 1
          fi
          pr="$(python -c 'import json,sys; print(json.load(sys.stdin)["pr_number"])' <<<"${RESOLUTION}")"
          {
            # Main may move while post-deploy commits land; retry merge a few times.
            merged=0
            for attempt in 1 2 3 4 5; do
              if gh pr merge "${pr}" --repo "${{ github.repository }}" --squash; then
                merged=1
                break
              fi
              echo "merge attempt ${attempt} failed; waiting for base to settle…"
              sleep 15
            done
            if [[ "${merged}" -ne 1 ]]; then
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### gate_merge
          - result: \`fail\`
          - pr: #${pr}
          - detail: squash merge failed after retries (base branch likely still moving)
          EOF
          )"
              exit 1
            fi
            # Keep PR review label in sync after merge (closed PRs still accept labels).
            GITHUB_TOKEN="${GH_TOKEN}" python scripts/pr_labels.py \
              --repo "${{ github.repository }}" \
              --issue "${ISSUE}" \
              --pr "${pr}" \
              --review review:approved || true
            MERGE_SHA="$(gh pr view "${pr}" --repo "${{ github.repository }}" --json mergeCommit --jq '.mergeCommit.oid // empty')"
            gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### gate_merge
          - result: \`merged\`
          - pr: #${pr}
          - strategy: squash
          - commit: \`${MERGE_SHA}\`
          - actor_checked: \`${{ github.actor }}\`
          - pr_labels: mirrored \`review:approved\`
          EOF
          )"
            python scripts/acceptance.py \
              --repo "${{ github.repository }}" \
              --issue "${ISSUE}" \
              --pr "${pr}" \
              --merge-sha "${MERGE_SHA}" \
              --mode close
          }
          for label in status:new status:queued status:in-progress status:blocked status:needs-review status:failed; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done
          gh issue edit "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --add-label "status:done" \
            --remove-label "review:needs-review" \
            --add-label "review:approved"

      - name: Write trace
        if: always()
        run: |
          set -euo pipefail
          OUTCOME="ok"
          if [[ "${{ job.status }}" != "success" ]]; then OUTCOME="fail"; fi
          ACTION="gate:${{ steps.meta.outputs.intent }}"
          python scripts/write_trace.py \
            --role gate \
            --issue "${{ steps.meta.outputs.issue }}" \
            --action "${ACTION}" \
            --outcome "${OUTCOME}" \
            --cost-usd 0

      - name: Upload agent trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace-gate-${{ steps.meta.outputs.issue }}-${{ github.run_id }}
          path: trace/agent-trace.jsonl
          if-no-files-found: ignore
