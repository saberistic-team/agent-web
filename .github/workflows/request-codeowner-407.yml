name: Request CODEOWNER for #407

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  request:
    if: github.event.pull_request.number == 407
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Request @saberistic review and ping issue
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/pulls/407/requested_reviewers" \
            -f 'reviewers[]=saberistic' || true
          gh pr comment 407 --repo "${REPO}" --body "$(cat <<'EOM'
          ### codeowner_needed
          - Gate cannot squash-merge without a CODEOWNER approval (`* @saberistic`)
          - Reviewer bot already `APPROVED`; please Approve PR #407 so Gate can merge
          EOM
          )"
          # Nudge Gate only after human approval — check reviewDecision first
          decision=$(gh pr view 407 --repo "${REPO}" --json reviewDecision --jq '.reviewDecision')
          echo "reviewDecision=${decision}"
          if [[ "${decision}" == "APPROVED" ]]; then
            # Retrigger Gate by toggling review:approved on the issue
            gh issue edit 121 --repo "${REPO}" --remove-label "review:approved" 2>/dev/null || true
            sleep 2
            gh issue edit 121 --repo "${REPO}" --add-label "review:approved"
            echo "Retriggered Gate via review:approved"
          fi
