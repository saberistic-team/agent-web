name: Agent — Builder

on:
  issues:
    types: [labeled]

jobs:
  build:
    if: github.event.label.name == 'agent:builder'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agents.txt

      - name: Mark in progress
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          for label in status:new status:queued status:blocked status:needs-review status:done status:failed; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done
          gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label "status:in-progress"
          gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### builder_status
          - status: \`status:in-progress\`
          EOF
          )"

      - name: Run builder agent
        env:
          # App token: labels, comments, commits, PRs
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Cursor SDK cloud agent (preferred coding path)
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_RUNTIME: ${{ vars.CURSOR_RUNTIME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Models inference (PAT preferred when Actions token returns 403)
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          CODEGEN_PROVIDER: ${{ vars.CODEGEN_PROVIDER }}
        run: |
          python scripts/run_agent.py \
            --role builder \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/builder.md

      - name: Advance status
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          HANDOFF="reviewer"
          if [[ -f trace/builder-handoff.txt ]]; then
            HANDOFF="$(tr -d '[:space:]' < trace/builder-handoff.txt)"
          fi
          for label in status:new status:queued status:in-progress status:blocked status:done status:failed status:needs-review; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done
          for label in review:needs-review review:approved review:changes-requested agent:reviewer agent:builder agent:docs agent:planner; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done

          case "${HANDOFF}" in
            done)
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "status:done"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### builder_handoff
          - status: \`status:done\`
          - next: none (verify/complete without PR)
          EOF
          )"
              gh issue close "${ISSUE}" --repo "${{ github.repository }}" --reason completed || true
              ;;
            blocked)
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "status:blocked"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### builder_handoff
          - status: \`status:blocked\`
          - next: \`@human-review\`
          EOF
          )"
              ;;
            waiting)
              # Unresolved conflicts, retryable codegen (timeouts / soft file
              # budget), or unfinished work: stay in the priority queue so
              # Builder runs again — never status:blocked for those cases.
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "status:queued"
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### builder_handoff
          - status: \`status:queued\`
          - next: dispatcher will re-apply \`agent:builder\` (retryable codegen / merge conflicts / unfinished)
          EOF
          )"
              ;;
            reviewer|*)
              gh issue edit "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --add-label "status:needs-review" \
                --add-label "review:needs-review" \
                --add-label "agent:reviewer"
              # Mirror type/priority/review onto the linked PR (not agent/status).
              GITHUB_TOKEN="${GH_TOKEN}" python scripts/pr_labels.py \
                --repo "${{ github.repository }}" \
                --issue "${ISSUE}" \
                --review review:needs-review || true
              gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          ### builder_handoff
          - status: \`status:needs-review\`
          - next: \`agent:reviewer\`
          - pr_labels: mirrored \`type:*\` \`priority:*\` \`review:needs-review\`
          EOF
          )"
              ;;
          esac

      - name: Dispatch next queued work
        if: always()
        env:
          GITHUB_TOKEN: ${{ steps.builder.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p trace
          python scripts/dispatch_queue.py | tee trace/dispatch-after-builder.json

      - name: Write trace
        if: always()
        run: |
          set -euo pipefail
          OUTCOME="ok"
          if [[ "${{ job.status }}" != "success" ]]; then OUTCOME="fail"; fi
          MODEL_ARGS=()
          if [[ -f trace/builder-model.txt ]]; then
            MODEL="$(tr -d '[:space:]' < trace/builder-model.txt)"
            if [[ -n "${MODEL}" ]]; then
              MODEL_ARGS=(--model "${MODEL}")
            fi
          fi
          python scripts/write_trace.py \
            --role builder \
            --issue "${{ github.event.issue.number }}" \
            --action build \
            --outcome "${OUTCOME}" \
            --cost-usd 0 \
            "${MODEL_ARGS[@]}"

      - name: Upload agent trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace-builder-${{ github.event.issue.number }}-${{ github.run_id }}
          path: trace/agent-trace.jsonl
          if-no-files-found: ignore
