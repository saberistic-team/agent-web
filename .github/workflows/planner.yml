name: Agent — Planner

# Triggers on status:new (entry point). Only the Planner may move work out of it.
on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'status:new'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run planner agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANNER_APP_ID: ${{ secrets.PLANNER_APP_ID }}
          PLANNER_PRIVATE_KEY: ${{ secrets.PLANNER_PRIVATE_KEY }}
        run: |
          python scripts/run_agent.py \
            --role planner \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/planner.md

      - name: Upload planner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planner-${{ github.event.issue.number }}
          path: trace/planner-${{ github.event.issue.number }}-*
          if-no-files-found: ignore

  gate:
    needs: plan
    uses: ./.github/workflows/gate.yml
    with:
      issue_number: ${{ fromJSON(needs.plan.outputs.issue) }}
      intent: release-plan
    secrets: inherit

  release:
    needs: [plan, gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download planner artifacts
        uses: actions/download-artifact@v4
        with:
          name: planner-${{ needs.plan.outputs.issue }}
          path: trace
        continue-on-error: true

      - name: Check permission before queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/check_permission.py \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}" \
            --min-level write

      - name: Relabel or spawn queued children
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.plan.outputs.issue }}
        run: |
          set -euo pipefail
          # Prefer children emitted by the planner (one number per line).
          # Each child must carry agent:*/type:*/status:queued.
          CHILDREN_FILE="trace/planner-${ISSUE}-children.txt"
          if [[ -f "${CHILDREN_FILE}" ]] && [[ -s "${CHILDREN_FILE}" ]]; then
            while read -r child; do
              [[ -z "${child}" ]] && continue
              echo "Child issue #${child} expected to already carry agent:*/type:*/status:queued"
            done < "${CHILDREN_FILE}"
            gh issue edit "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --remove-label "status:new" \
              --add-label "status:done"
          else
            # Single-issue path: leave agent:*/type:* as planned; queue this issue.
            gh issue edit "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --remove-label "status:new" \
              --add-label "status:queued"
          fi
