name: Agent — Planner

on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'status:new'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      issue: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint Planner App token
        id: planner
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run planner agent
        env:
          GITHUB_TOKEN: ${{ steps.planner.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/run_agent.py \
            --role planner \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/planner.md

      - name: Upload planner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planner-${{ github.event.issue.number }}
          path: trace/planner-${{ github.event.issue.number }}-*
          if-no-files-found: ignore

  gate:
    needs: plan
    uses: ./.github/workflows/gate.yml
    with:
      issue_number: ${{ fromJSON(needs.plan.outputs.issue) }}
      intent: release-plan
    secrets: inherit

  release:
    needs: [plan, gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint Planner App token
        id: planner
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download planner artifacts
        uses: actions/download-artifact@v4
        with:
          name: planner-${{ needs.plan.outputs.issue }}
          path: trace
        continue-on-error: true

      - name: Check permission before queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_TOKEN: ${{ steps.planner.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/check_permission.py \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}" \
            --issue "${{ needs.plan.outputs.issue }}" \
            --min-level write

      - name: Require visible planner_plan comment
        env:
          GITHUB_TOKEN: ${{ steps.planner.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/require_planner_plan.py \
            --repo "${{ github.repository }}" \
            --issue "${{ needs.plan.outputs.issue }}"

      - name: Relabel or spawn queued children
        env:
          GH_TOKEN: ${{ steps.planner.outputs.token }}
          ISSUE: ${{ needs.plan.outputs.issue }}
        run: |
          set -euo pipefail
          CHILDREN_FILE="trace/planner-${ISSUE}-children.txt"
          if [[ -f "${CHILDREN_FILE}" ]] && [[ -s "${CHILDREN_FILE}" ]]; then
            while read -r child; do
              [[ -z "${child}" ]] && continue
              echo "Child issue #${child} already queued by Planner App"
            done < "${CHILDREN_FILE}"
            gh issue edit "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --remove-label "status:new" \
              --add-label "status:done"
          else
            gh issue edit "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --remove-label "status:new" \
              --add-label "status:queued"
          fi
          gh issue comment "${ISSUE}" --repo "${{ github.repository }}" \
            --body "### planner_release
- actor_checked: \`${{ github.actor }}\`
- result: queued_or_parent_done
"
