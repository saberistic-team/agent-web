# One-shot: apply Reviewer handoff labels for issue #121 / PR #407.
# Runs only for PR 407; safe to delete after labels are applied.
name: Retrigger Reviewer (#121)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  handoff:
    if: github.event.pull_request.number == 407
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Apply reviewer handoff labels on issue #121
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: "121"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for label in \
            status:new status:queued status:in-progress status:blocked \
            status:done status:failed status:needs-review \
            review:needs-review review:approved review:changes-requested \
            agent:reviewer agent:builder agent:docs agent:planner
          do
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label "${label}" 2>/dev/null || true
          done
          gh issue edit "${ISSUE}" --repo "${REPO}" \
            --add-label "status:needs-review" \
            --add-label "review:needs-review" \
            --add-label "agent:reviewer"
          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$(cat <<'EOF'
          ### builder_handoff
          - status: `status:needs-review`
          - next: `agent:reviewer`
          - note: one-shot Actions handoff after conflicts + coverage fixes on PR #407 (`11f4e131`+)
          EOF
          )"
          echo "Labels after handoff:"
          gh issue view "${ISSUE}" --repo "${REPO}" --json labels --jq '[.labels[].name]'
