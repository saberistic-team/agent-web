# One-shot: re-apply agent:reviewer after a push dismissed the prior APPROVED review.
name: Retrigger Reviewer (#121)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  handoff:
    if: github.event.pull_request.number == 407
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Handoff to Reviewer and keep CODEOWNER requested
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
          ISSUE: "121"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/pulls/407/requested_reviewers" \
            -f 'reviewers[]=saberistic' || true
          for label in \
            status:new status:queued status:in-progress status:blocked \
            status:done status:failed status:needs-review \
            review:needs-review review:approved review:changes-requested \
            agent:reviewer agent:builder agent:docs agent:planner
          do
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label "${label}" 2>/dev/null || true
          done
          sleep 2
          gh issue edit "${ISSUE}" --repo "${REPO}" \
            --add-label "status:needs-review" \
            --add-label "review:needs-review" \
            --add-label "agent:reviewer"
          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$(cat <<'EOM'
          ### builder_handoff
          - status: `status:needs-review`
          - next: `agent:reviewer`
          - note: re-review after push; CODEOWNER @saberistic still required for Gate merge
          EOM
          )"
