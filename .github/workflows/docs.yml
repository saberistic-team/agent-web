name: Agent — Docs

on:
  issues:
    types: [labeled]

jobs:
  docs:
    if: github.event.label.name == 'agent:docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mark in progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          for label in status:new status:queued status:blocked status:needs-review status:done status:failed; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done
          gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label "status:in-progress"

      - name: Run docs agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_APP_ID: ${{ secrets.DOCS_APP_ID }}
          DOCS_PRIVATE_KEY: ${{ secrets.DOCS_PRIVATE_KEY }}
        run: |
          python scripts/run_agent.py \
            --role docs \
            --issue "${{ github.event.issue.number }}" \
            --brief AGENTS/docs.md

      - name: Advance status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          for label in status:new status:queued status:in-progress status:blocked status:needs-review status:failed; do
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --remove-label "${label}" 2>/dev/null || true
          done
          gh issue edit "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --add-label "status:done" \
            --remove-label "agent:docs"
