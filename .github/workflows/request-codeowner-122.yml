# One-shot: request CODEOWNER review + enable auto-merge for PR #417.
# Uses Builder App token (cloud agent GITHUB_TOKEN cannot request reviewers).
name: Request CODEOWNER (#122)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  request:
    if: github.event.pull_request.number == 417
    runs-ons: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint Builder App token
        id: builder
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Request CODEOWNER and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.builder.outputs.token }}
          REPO: ${{ github.repository }}
          PR: "417"
          ISSUE: "122"
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f reviewers[]=saberistic || true
          # Prefer squash auto-merge so Gate/branch policy can merge when CODEOWNER approves.
          gh pr merge "${PR}" --repo "${REPO}" --squash --auto || true
          gh issue comment "${ISSUE}" --repo "${REPO}" --body "$(cat <<'EOM'
          ### builder_codeowner_request
          - pr: #417
          - requested: `@saberistic` (CODEOWNER)
          - auto_merge: squash (pending CODEOWNER approval)
          EOM
          )"
          gh pr view "${PR}" --repo "${REPO}" --json reviewRequests,autoMergeRequest,mergeStateStatus,reviewDecision
