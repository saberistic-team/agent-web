databases:
  - name: agent-web-db
    plan: free
    databaseName: agent_web
    user: agent_web

services:
  - type: web
    name: agent-web-hello
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-web-db
          property: connectionString
      - key: APP_BASE_URL
        value: https://saberistic.com
