databases:
  - name: agent-web-db
    plan: free
    databaseName: agent_web
    user: agent_web

services:
  - type: web
    name: agent-web-hello
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-web-db
          property: connectionString
      - key: BASE_URL
        value: https://saberistic.com
      - key: FROM_EMAIL
        value: noreply@saberistic.com
      - key: NOTIFY_EMAIL
        value: inbox@saberistic.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANALYTICS_ENABLED
        value: "true"
      - key: PLAUSIBLE_DOMAIN
        value: saberistic.com
      - key: PLAUSIBLE_API_KEY
        sync: false
      - key: ANALYTICS_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_TTL_SECONDS
        value: "86400"
      - key: ADMIN_TRUSTED_PROXY_CIDRS
        value: "*"
      - key: UVICORN_PROXY_HEADERS
        value: "true"
      - key: UVICORN_FORWARDED_ALLOW_IPS
        value: "*"
