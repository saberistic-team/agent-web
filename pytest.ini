[pytest]
testpaths = tests
pythonpath = . scripts
markers =
    unit: Fast unit tests for service code under app/ (no external services)
    integration: Service integration tests for app/ (in-process HTTP / mocked deps)
    contract: Live-PostgreSQL CRM contract suite (tests/pg_contract/); needs TEST_DATABASE_URL
    browser: Playwright-driven browser suite for client-side JS (e.g. site/assets/linkedin-import.js); needs the playwright package + Chromium

# Prefer explicit marker selection via scripts/check_coverage.py
filterwarnings =
    ignore::DeprecationWarning
