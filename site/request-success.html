<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request received — saberistic</title>
    <meta
      name="description"
      content="Your project brief request was received."
    />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" aria-label="saberistic home">
        <img
          class="brand-word"
          src="/assets/logo-text.png"
          width="160"
          height="41"
          alt="saberistic"
        />
      </a>
    </header>

    <main>
      <section class="block form-block" aria-labelledby="success-title">
        <h1 class="page-title" id="success-title">We received your request.</h1>
        <p class="form-lede">
          Thank you. Payment was successful and your project brief is on its way
          to the saberistic team. If you provided an email address, a
          confirmation is on its way.
        </p>
        <p class="cta-row">
          <a class="cta" href="/">Back to home</a>
        </p>
      </section>
    </main>

    <footer class="foot">
      <p>saberistic · software development</p>
    </footer>
  </body>
</html>
